source:
  id: sicoes
  name: Sistema de Contrataciones Estatales (SICOES)
  base_url: https://www.sicoes.gob.bo
  allowed_domains:
    - sicoes.gob.bo
    - www.sicoes.gob.bo

crawl:
  seeds:
    - https://www.sicoes.gob.bo/
    - https://www.sicoes.gob.bo/portal/index.php
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "portal"
    - "normativa"
    - "formularios"
    - "convocatorias"
    - "documentos"
  dataset_rules:
    - id: normativa_sicoes
      name: Normativa y Decretos SICOES
      url_patterns:
        - "normativa"
        - "decreto"
        - "resolucion"
    - id: formularios_pliegos_sicoes
      name: Formularios y Pliegos SICOES
      url_patterns:
        - "formulario"
        - "guia"
        - "manual"
    - id: repositorio_general_sicoes
      name: Repositorio General de Contrataciones SICOES
      url_patterns:
        - "/portal/"
        - "/documentos/"
        - "/archivos/"
  excluded_path_keywords:
    - "/lib/"
    - "/js/"
    - "/css/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
