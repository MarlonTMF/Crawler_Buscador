# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: IBCH (Instituto Boliviano del Cemento y Hormigón)
# Calibrado para B-20 (Etapa C)
# ==============================================================================

source:
  id: ibch
  name: "Instituto Boliviano del Cemento y Hormigón"
  base_url: https://www.ibch.com
  allowed_domains:
    - www.ibch.com
    - ibch.com

crawl:
  seeds:
    - https://www.ibch.com/
    - https://www.ibch.com/boletin/
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - wp-content/uploads
    - boletin
    - pdf
  dataset_rules:
    - id: boletines_tecnicos_cemento
      name: "Boletines Técnicos de Cemento y Hormigón"
      url_patterns:
        - "boletin"
        - "BOLETIN"
    - id: manuales_normas_construccion
      name: "Manuales, Dossiers y Guías Técnicas"
      url_patterns:
        - "wp-content/uploads"
        - "ibch.com"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
