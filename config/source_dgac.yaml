# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: DGAC (Dirección General de Aeronáutica Civil)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: dgac
  name: "Dirección General de Aeronáutica Civil"
  base_url: https://www.dgac.gob.bo
  allowed_domains:
    - www.dgac.gob.bo
    - dgac.gob.bo

crawl:
  seeds:
    - https://www.dgac.gob.bo
    - https://www.dgac.gob.bo/anuario-estadistico-dta/
    - https://www.dgac.gob.bo/autorizaciones-de-vuelos/
    - https://www.dgac.gob.bo/informes-mensuales-de-trafico-aereo-2026/
    - https://www.dgac.gob.bo/informes-mensuales-de-trafico-aereo-en-bolivia-2025/
  max_depth: 2
  max_pages: 50
  strategy: bfs
  rate_limit_per_second: 0.1
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/wp-content/uploads/"
    - "LEY"
    - "RM_"
  dataset_rules:
    - id: normativa_aeronautica
      name: "Leyes, Reglamentos y Normativa Aeronáutica"
      url_patterns:
        - "wp-content/uploads"
        - "LEY"
        - "RM"
      title_keywords:
        - "ley"
        - "normativa"
        - "reglamento"
        - "resolucion"
        - "aeronautica"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
