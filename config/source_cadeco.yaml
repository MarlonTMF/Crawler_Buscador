# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: CADECO (Cámara Departamental de la Construcción de La Paz)
# Calibrado para B-19 (Etapa C)
# ==============================================================================

source:
  id: cadeco
  name: "Cámara Departamental de la Construcción de La Paz"
  base_url: http://cadecolp.org
  allowed_domains:
    - www.cadecolp.org
    - cadecolp.org

crawl:
  seeds:
    - http://cadecolp.org/
    - http://cadecolp.org/boletin-informativo/
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - wp-content/uploads
    - boletin
    - pdf
  dataset_rules:
    - id: boletines_construccion
      name: "Boletines Informativos de Construcción"
      url_patterns:
        - "boletin"
        - "BOLETIN"
    - id: normativa_institucional
      name: "Estatutos y Reglamentos Institucionales"
      url_patterns:
        - "wp-content/uploads"
        - "cadecolp.org"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
