# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: ADA (ADA Bolivia)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: ada
  name: "ADA Bolivia"
  base_url: https://www.adascz.com.bo
  allowed_domains:
    - www.adascz.com.bo
    - adascz.com.bo

crawl:
  seeds:
    - https://www.adascz.com.bo/
    - https://www.adascz.com.bo/publicaciones/boletin-de-precios
    - https://www.adascz.com.bo/publicaciones/memorias
    - https://www.adascz.com.bo/publicaciones/estadisticas-del-sector
  max_depth: 2
  max_pages: 60
  strategy: bfs
  rate_limit_per_second: 0.05
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/images/boletin-precios/"
    - "/images/memorias/"
    - "Boletin-Precios"
    - "Memoria-ADA"
  dataset_rules:
    - id: boletines_precios
      name: "Boletines de Precios Avícolas"
      url_patterns:
        - "boletin-precios"
        - "Boletin-Precios"
      title_keywords:
        - "precios"
        - "avicolas"
        - "boletin"
        - "pollo"
        - "huevo"
    - id: memorias_institucionales
      name: "Memorias Anuales ADA"
      url_patterns:
        - "memorias"
        - "Memoria"
      title_keywords:
        - "memoria"
        - "anual"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
