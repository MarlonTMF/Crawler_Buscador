# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: ATT (Autoridad de Regulación y Fiscalización de Telecomunicaciones y Transportes)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: att
  name: "Autoridad de Regulación y Fiscalización de Telecomunicaciones y Transportes"
  base_url: https://www.att.gob.bo
  allowed_domains:
    - www.att.gob.bo
    - att.gob.bo

crawl:
  seeds:
    - https://www.att.gob.bo
    - https://www.att.gob.bo/index.php/en/memoria-institucional-v2
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/sites/default/files/"
    - "Memoria"
    - "telecomunicaciones"
  dataset_rules:
    - id: memoria_institucional
      name: "Memorias Institucionales Anuales"
      url_patterns:
        - "Memoria"
        - "memoria"
      title_keywords:
        - "memoria"
        - "institucional"
        - "anual"
    - id: telecomunicaciones
      name: "Regulación y Estadísticas de Telecomunicaciones y Transportes"
      url_patterns:
        - "telecomunicaciones"
        - "transporte"
        - "sites/default/files"
      title_keywords:
        - "telecomunicaciones"
        - "transporte"
        - "regulacion"
        - "tarifas"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
