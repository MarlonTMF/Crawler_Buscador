# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: ICCO (International Cocoa Organization)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: icco
  name: "International Cocoa Organization"
  base_url: https://www.icco.org
  allowed_domains:
    - www.icco.org
    - icco.org

crawl:
  seeds:
    - https://www.icco.org
    - https://www.icco.org/icco-documentation/
    - https://www.icco.org/statistics/
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip, doc, docx]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: true

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "uploads"
    - "bulletin"
    - "market-report"
    - "statistics"
    - "agreements"
    - "documentation"
  dataset_rules:
    - id: market_reports
      name: Cocoa Market Reports
      url_patterns:
        - "/cocoa-market-report"
        - "market-report"
    - id: cocoa_statistics
      name: Quarterly Bulletin of Cocoa Statistics
      url_patterns:
        - "bulletin"
        - "statistics"
    - id: institutional_docs
      name: Documentación Institucional
      url_patterns:
        - "agreement"
        - "documentation"
        - "annual-report"
  excluded_path_keywords:
    - "/contact/"
    - "/privacy-policy/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
