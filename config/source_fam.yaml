# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: FAM (Federación de Asociaciones Municipales de Bolivia)
# Calibrado para B-18 (Etapa C)
# ==============================================================================

source:
  id: fam
  name: "Federación de Asociaciones Municipales de Bolivia"
  base_url: https://fam.org.bo
  allowed_domains:
    - www.fam.org.bo
    - fam.org.bo

crawl:
  seeds:
    - https://fam.org.bo/memoria-institucional/
    - https://fam.org.bo/publicaciones/
    - https://fam.org.bo/compendio-normativo-municipal-3/
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - wp-content/uploads
    - memoria
    - compendio
    - pdf
  dataset_rules:
    - id: memorias_municipales
      name: "Memorias Institucionales Municipales"
      url_patterns:
        - "MEMORIA"
        - "memoria"
    - id: compendios_normativos
      name: "Compendios Normativos Municipales"
      url_patterns:
        - "compendio"
        - "COMPENDIO"
        - "GUIA"
        - "normativo"
    - id: publicaciones_municipales
      name: "Publicaciones y Guías Municipales"
      url_patterns:
        - "wp-content/uploads"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
