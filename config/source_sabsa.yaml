source:
  id: sabsa
  name: Navegación Aérea y Aeropuertos Bolivianos (NAABOL / ex-SABSA)
  base_url: https://naabol.gob.bo
  allowed_domains:
    - naabol.gob.bo
    - www.naabol.gob.bo
    - sabsa.aero
    - www.sabsa.aero

crawl:
  seeds:
    - https://naabol.gob.bo/
    - https://naabol.gob.bo/transparencia/
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "wp-content"
    - "uploads"
    - "transparencia"
    - "rendicion"
    - "resolucion"
    - "informe"
  dataset_rules:
    - id: rendicion_transparencia_naabol
      name: Rendición de Cuentas y Transparencia NAABOL
      url_patterns:
        - "transparencia"
        - "rendicion"
        - "informe"
        - "poa"
    - id: resoluciones_normativa_naabol
      name: Resoluciones Administrativas y Normativa NAABOL
      url_patterns:
        - "resolucion"
        - "reglamento"
        - "norma"
    - id: repositorio_general_naabol
      name: Repositorio General NAABOL
      url_patterns:
        - "/uploads/"
        - "/wp-content/"
  excluded_path_keywords:
    - "/wp-admin/"
    - "/wp-includes/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
