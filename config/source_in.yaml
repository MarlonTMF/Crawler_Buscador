# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: IN (Impuestos Nacionales (Servicio de Impuestos Nacionales - SIN))
# Calibrado para B-19 (Etapa C)
# ==============================================================================

source:
  id: in
  name: "Impuestos Nacionales (Servicio de Impuestos Nacionales - SIN)"
  base_url: https://www.impuestos.gob.bo
  allowed_domains:
    - www.impuestos.gob.bo
    - impuestos.gob.bo

crawl:
  seeds:
    - https://www.impuestos.gob.bo/index.php/memoria-intitucional/
    - https://www.impuestos.gob.bo/index.php/informes-de-auditoria/
    - https://www.impuestos.gob.bo/index.php/pei-descargable/
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - wp-content/uploads
    - memoria
    - auditoria
    - pei
    - pdf
  dataset_rules:
    - id: memorias_institucionales
      name: "Memorias Institucionales"
      url_patterns:
        - "memoria"
        - "Memoria"
    - id: informes_auditoria
      name: "Informes de Auditoría"
      url_patterns:
        - "auditoria"
        - "Auditoria"
        - "informe"
    - id: gestion_tributaria
      name: "Gestión Tributaria y Planificación"
      url_patterns:
        - "wp-content/uploads"
        - "impuestos.gob.bo"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
