# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: AN (Aduana Nacional de Bolivia)
# Calibrado para B-18 (Etapa C)
# ==============================================================================

source:
  id: an
  name: "Aduana Nacional de Bolivia"
  base_url: https://www.aduana.gob.bo
  allowed_domains:
    - www.aduana.gob.bo
    - aduana.gob.bo

crawl:
  seeds:
    - https://www.aduana.gob.bo/INSTI_memorias
    - https://www.aduana.gob.bo/com_boletines
    - https://www.aduana.gob.bo/informes_auditorias
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - sites/default/files
    - memoria
    - Boletines
    - poai
    - pdf
  dataset_rules:
    - id: memorias_institucionales
      name: "Memorias Institucionales"
      url_patterns:
        - "sites/default/files/memoria"
    - id: boletines_aduaneros
      name: "Boletines Informativos y Comerciales"
      url_patterns:
        - "sites/default/files/Boletines"
    - id: gestion_aduanera
      name: "Gestión Institucional y Auditorías"
      url_patterns:
        - "sites/default/files"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"
    - "/user"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
