source:
  id: mhe
  name: Ministerio de Hidrocarburos y Energías (MHE)
  base_url: https://hidrocarburos.org
  allowed_domains:
    - hidrocarburos.org
    - www.hidrocarburos.org

crawl:
  seeds:
    - https://hidrocarburos.org/
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "wp-content"
    - "uploads"
    - "informe"
    - "resolucion"
    - "aviso"
  dataset_rules:
    - id: normativa_institucional_mhe
      name: Normativa y Resoluciones MHE
      url_patterns:
        - "resolucion"
        - "norma"
        - "reglamento"
        - "aviso"
    - id: repositorio_general_mhe
      name: Repositorio General MHE
      url_patterns:
        - "/uploads/"
        - "/wp-content/"
  excluded_path_keywords:
    - "/wp-admin/"
    - "/wp-includes/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
