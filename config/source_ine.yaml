# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: INE (Instituto Nacional de Estadística)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: ine
  name: "Instituto Nacional de Estadística"
  base_url: https://www.ine.gob.bo
  allowed_domains:
    - www.ine.gob.bo
    - ine.gob.bo

crawl:
  seeds:
    - https://www.ine.gob.bo/index.php/institucion/planificacion/planificacion-estrategica-pei/plan-estrategico-institucional-pei-2016-2020/
    - https://www.ine.gob.bo/index.php/institucion/escala-salarial/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/cuadro-de-cuentas-economicas-integradas/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/cuentas-consolidadas-de-la-nacion/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/matrices/matrices-de-insumo-producto/
    - https://www.ine.gob.bo/index.php/metadatos-y-microdatos/
  max_depth: 2
  max_pages: 50
  strategy: bfs
  rate_limit_per_second: 0.1
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/descarga/"
    - "pei"
    - "escala"
  dataset_rules:
    - id: cuentas_nacionales_pib
      name: "Cuentas Nacionales, PIB y Matrices Insumo-Producto"
      periodicity: anual
      tolerance: 1
      url_patterns:
        - "insumo-producto"
        - "cuentas-economicas"
        - "pib-y-cuentas"
        - "cuentas-consolidadas"
      title_keywords:
        - "insumo producto"
        - "cuentas nacionales"
        - "pib"
        - "matriz"
    - id: auditoria_interna
      name: "Informes de Auditoría Interna"
      periodicity: anual
      tolerance: 1
      url_patterns:
        - "auditoria-interna"
        - "auditoria"
      title_keywords:
        - "auditoria interna"
        - "auditoria"
    - id: rendicion_cuentas
      name: "Rendición Pública de Cuentas"
      periodicity: semestral
      tolerance: 1
      url_patterns:
        - "rendicion-publica"
        - "rendicion-de-cuentas"
        - "audiencia-de-rendicion"
      title_keywords:
        - "rendicion publica"
        - "audiencia"
    - id: gestion_administrativa_financiera
      name: "Gestión Administrativa, Financiera y Normativa"
      periodicity: eventual
      tolerance: 0
      url_patterns:
        - "informacion-financiera"
        - "procedimientos-administrativos"
        - "informacion-administrativa"
        - "manual-de-procesos"
        - "planes-de-trabajo"
        - "poa"
        - "reglamento"
        - "resolucion"
        - "formulario"
        - "contrataciones"
        - "convocatoria"
      title_keywords:
        - "financiera"
        - "administrativa"
        - "procedimientos"
        - "poa"
    - id: estadisticas_sociales_demograficas
      name: "Estadísticas Sociales, Empleo y Demografía"
      periodicity: eventual
      tolerance: 0
      url_patterns:
        - "estadisticas-sociales"
        - "empleo"
        - "mercado-laboral"
        - "censo"
        - "demograf"
        - "certificado-de-estadisticas"
        - "boletines-estadisticos"
      title_keywords:
        - "empleo"
        - "sociales"
        - "censo"
        - "demografia"
    - id: planes_estrategicos
      name: "Planes Estratégicos Institucionales (PEI)"
      periodicity: eventual
      tolerance: 0
      url_patterns:
        - "planes-estrategicos"
        - "/pei"
        - "-pei"
      title_keywords:
        - "plan estrategico"
        - "pei"
    - id: escala_salarial
      name: "Escala Salarial y Estructura Organizacional"
      periodicity: anual
      tolerance: 1
      url_patterns:
        - "escala-salarial"
        - "escala"
      title_keywords:
        - "escala salarial"
        - "salarial"
    - id: documentos_institucionales_otros
      name: "Otros Documentos Institucionales"
      periodicity: eventual
      tolerance: 0
      url_patterns:
        - "/index.php/"
      title_keywords:
        - "instituto nacional"
  excluded_path_keywords:
    - "/contacto"
    - "/login"
    - "wp-admin"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
