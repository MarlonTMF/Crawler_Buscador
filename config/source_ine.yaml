# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: INE (Instituto Nacional de Estadística)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: ine
  name: "Instituto Nacional de Estadística"
  base_url: https://www.ine.gob.bo
  allowed_domains:
    - www.ine.gob.bo
    - ine.gob.bo

crawl:
  seeds:
    - https://www.ine.gob.bo/index.php/institucion/planificacion/planificacion-estrategica-pei/plan-estrategico-institucional-pei-2016-2020/
    - https://www.ine.gob.bo/index.php/institucion/escala-salarial/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/cuadro-de-cuentas-economicas-integradas/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/cuentas-consolidadas-de-la-nacion/
    - https://www.ine.gob.bo/index.php/estadisticas-economicas/pib-y-cuentas-nacionales/matrices/matrices-de-insumo-producto/
    - https://www.ine.gob.bo/index.php/metadatos-y-microdatos/
  max_depth: 2
  max_pages: 50
  strategy: bfs
  rate_limit_per_second: 0.1
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/descarga/"
    - "pei"
    - "escala"
  dataset_rules:
    - id: planes_estrategicos
      name: "Planes Estratégicos Institucionales (PEI)"
      url_patterns:
        - "pei"
        - "planes-estrategicos"
      title_keywords:
        - "pei"
        - "estrategico"
        - "institucional"
    - id: escala_salarial
      name: "Escala Salarial y Estructura Organizacional"
      url_patterns:
        - "escala"
        - "salarial"
      title_keywords:
        - "escala"
        - "salarial"
  excluded_path_keywords:
    - "/contacto"
    - "/login"
    - "wp-admin"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
