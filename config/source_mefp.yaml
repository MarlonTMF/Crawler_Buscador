# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: MEFP (Ministerio de Economía y Finanzas Públicas)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: mefp
  name: "Ministerio de Economía y Finanzas Públicas"
  base_url: https://www.economiayfinanzas.gob.bo
  allowed_domains:
    - www.economiayfinanzas.gob.bo
    - economiayfinanzas.gob.bo
    - media.economiayfinanzas.gob.bo
    - 200.75.171.4

crawl:
  seeds:
    - https://www.economiayfinanzas.gob.bo
    - https://www.economiayfinanzas.gob.bo/boletines
    - https://media.economiayfinanzas.gob.bo/boletines
    - https://www.economiayfinanzas.gob.bo/index.php/viceministerios/vtcp/deuda_cronogramas_pagos_eta_up_ultima_gestion
    - https://www.economiayfinanzas.gob.bo/index.php/recaudaciones-aduaneras-capitulos
    - https://www.economiayfinanzas.gob.bo/index.php/indicadores-de-endeudamiento-referenciales
    - https://www.economiayfinanzas.gob.bo/index.php/informe-gestion
    - https://www.economiayfinanzas.gob.bo/index.php/informes-auditoria-interna
  max_depth: 3
  max_pages: 60
  strategy: priority
  rate_limit_per_second: 2.0
  verify_ssl: false
  allowed_extensions: [pdf, xlsx, xls, csv, zip, doc, docx]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: true

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "files"
    - "comunicado"
    - "informe"
    - "gestion"
    - "auditoria"
    - "poa"
    - "deuda"
    - "boletin"
    - "recaudacion"
  dataset_rules:
    - id: deuda_publica
      name: Deuda Pública Subnacional y Universidades
      url_patterns:
        - "deuda"
        - "cronograma"
        - "eta"
        - "up"
      title_keywords:
        - "deuda"
        - "cronogramas"
        - "pagos"
    - id: recaudaciones_aduaneras
      name: Recaudaciones Aduaneras por Capítulo
      url_patterns:
        - "recaudaci"
        - "aduanera"
      title_keywords:
        - "recaudación"
        - "aduanera"
    - id: boletines_estadisticos
      name: Boletines Estadísticos y Monitoreo Fiscal
      url_patterns:
        - "boletin"
        - "tributarias"
        - "monitoreo"
      title_keywords:
        - "boletín"
        - "monitoreo"
    - id: informe_gestion
      name: Informes de Gestión
      url_patterns:
        - "informe-gestion"
        - "gestion"
        - "informe"
    - id: auditoria_interna
      name: Informes de Auditoría
      url_patterns:
        - "auditoria"
  excluded_path_keywords:
    - "/contact/"
    - "/form/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
