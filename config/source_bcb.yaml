# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: BCB (Banco Central de Bolivia)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: bcb
  name: "Banco Central de Bolivia"
  base_url: https://www.bcb.gob.bo
  allowed_domains:
    - www.bcb.gob.bo
    - bcb.gob.bo
    - deudaexternapublica.bcb.gob.bo

crawl:
  seeds:
    - https://www.bcb.gob.bo
    - https://www.bcb.gob.bo/?q=estadisticas
    - https://www.bcb.gob.bo/?q=boletines-mensuales
    - https://www.bcb.gob.bo/?q=pub_boletin-mensual
    - https://www.bcb.gob.bo/?q=pub_boletin-estadistico
    - https://www.bcb.gob.bo/?q=pub_memorias-institucionales
    - https://www.bcb.gob.bo/?q=content%2Fsector-externo-0
    - https://www.bcb.gob.bo/?q=content%2Fsector-monetario
    - https://www.bcb.gob.bo/?q=reporte-estadistico
    - https://www.bcb.gob.bo/?q=indicadores_inflacion
    - https://www.bcb.gob.bo/?q=content%2Ftipo-de-cambio-oficial-del-d%C3%B3lar-estadounidense-serie-de-tiempo
    - https://www.bcb.gob.bo/?q=operaciones-mercado-abierto
    - https://www.bcb.gob.bo/?q=servicios%2Fufv%2Fdatos_estadisticos
  max_depth: 4
  max_pages: 150
  strategy: priority
  rate_limit_per_second: 2.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/webdocs/"
    - "/uploads/"
    - "Reservas"
    - "IEF"
    - "DEPEX"
    - "boletin"
    - "memoria"
  dataset_rules:
    - id: memorias_institucionales
      name: "Memorias Institucionales y Anuales"
      url_patterns:
        - "memoria"
        - "memorias"
      title_keywords:
        - "memoria"
        - "memorias"
    - id: boletines_mensuales
      name: "Boletines Mensuales y Publicaciones"
      url_patterns:
        - "bolet"
        - "boletin"
        - "boletines"
        - "sistema_pagos"
      title_keywords:
        - "bolet"
        - "boletin"
        - "boletines"
        - "cronograma"
    - id: reservas_internacionales
      name: "Reservas Internacionales Netas (RIN)"
      url_patterns:
        - "Reservas"
        - "RIN"
        - "sector_externo"
      title_keywords:
        - "reservas"
        - "rin"
        - "componentes"
    - id: estabilidad_financiera
      name: "Informes de Estabilidad Financiera (IEF)"
      url_patterns:
        - "IEF"
        - "politicasbcb"
      title_keywords:
        - "estabilidad"
        - "financiera"
        - "ief"
    - id: deuda_externa
      name: "Informes y Reglamentos de Deuda Externa Pública"
      url_patterns:
        - "DEPEX"
        - "deudaexterna"
        - "REGLAM_DEXT"
      title_keywords:
        - "deuda"
        - "externa"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
