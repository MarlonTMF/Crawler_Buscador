# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: AE (Autoridad de Fiscalizacion de Electricidad dey Tecnologia Nuclear)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: ae
  name: "Autoridad de Fiscalizacion de Electricidad dey Tecnologia Nuclear"
  base_url: https://aetn.gob.bo
  allowed_domains:
    - www.aetn.gob.bo
    - aetn.gob.bo

crawl:
  seeds:
    - https://aetn.gob.bo
    - https://aetn.gob.bo/memoria-intitucional/
    - https://aetn.gob.bo/datos-y-estadisticas/
  max_depth: 2
  max_pages: 70
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/wp-content/uploads/"
    - "MEMORIA"
    - "Anuario"
    - "AETN"
  dataset_rules:
    - id: memorias_institucionales
      name: "Memorias Institucionales Anuales"
      url_patterns:
        - "MEMORIA"
        - "Memoria"
        - "memoria"
      title_keywords:
        - "memoria"
        - "institucional"
        - "anual"
    - id: estadisticas_electricidad
      name: "Anuarios Estadísticos del Sector Eléctrico"
      url_patterns:
        - "datos-y-estadisticas"
        - "Anuario"
        - "anuario"
        - "AETN"
        - "wp-content/uploads"
      title_keywords:
        - "anuario"
        - "estadistica"
        - "electricidad"
        - "aetn"
  excluded_path_keywords:
    - "/contacto"
    - "/login"
    - "/page/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
