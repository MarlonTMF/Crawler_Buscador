# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: Min. Educacion (Ministerio de Educación)
# Calibrado para B-19 (Etapa C)
# ==============================================================================

source:
  id: min_educacion
  name: "Ministerio de Educación"
  base_url: https://www.minedu.gob.bo
  allowed_domains:
    - www.minedu.gob.bo
    - minedu.gob.bo

crawl:
  seeds:
    - https://www.minedu.gob.bo
    - https://www.minedu.gob.bo/index.php?option=com_content&view=category&layout=blog&id=283&Itemid=1087
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - files
    - publicaciones
    - pdf
  dataset_rules:
    - id: publicaciones_educativas
      name: "Publicaciones y Convocatorias Educativas"
      url_patterns:
        - "files/publicaciones"
        - "publicaciones"
    - id: documentos_educacion
      name: "Documentos Normativos y Gestión Educativa"
      url_patterns:
        - "files"
        - "minedu.gob.bo"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
