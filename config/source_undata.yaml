# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: UNDATA (United Nations Data)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: undata
  name: "United Nations Data"
  base_url: https://data.un.org
  allowed_domains:
    - www.data.un.org
    - data.un.org

crawl:
  seeds:
    - https://data.un.org/Default.aspx
    - https://data.un.org
    - https://data.un.org/Explorer.aspx
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "_Docs"
    - "SYB"
    - "PDFs"
    - "CSV"
  dataset_rules:
    - id: statistical_yearbook_pdf
      name: UN Statistical Yearbook PDFs
      url_patterns:
        - "/PDFs/"
        - "SYB"
    - id: statistical_yearbook_csv
      name: UN Statistical Yearbook Datasets CSV
      url_patterns:
        - "/CSV/"
  excluded_path_keywords:
    - "/Glossary.aspx"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
