source:
  id: oba
  name: Observatorio Bolivia Autonómica (SEA - OBA)
  base_url: https://sea.gob.bo
  allowed_domains:
    - sea.gob.bo
    - www.sea.gob.bo

crawl:
  seeds:
    - https://sea.gob.bo/centro-de-datos-autonomicos/
    - https://sea.gob.bo/
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "wp-content"
    - "uploads"
    - "datos"
    - "estadistica"
    - "informe"
    - "publicaciones"
  dataset_rules:
    - id: datos_autonomicos_oba
      name: Centro de Datos y Estadísticas Autonómicas OBA
      url_patterns:
        - "centro-de-datos"
        - "datos"
        - "estadistica"
        - "boletin"
    - id: publicaciones_estudios_sea
      name: Publicaciones y Estudios Normativos SEA
      url_patterns:
        - "publicacion"
        - "informe"
        - "estudio"
        - "norma"
    - id: repositorio_general_oba
      name: Repositorio General SEA/OBA
      url_patterns:
        - "/uploads/"
        - "/wp-content/"
  excluded_path_keywords:
    - "/wp-admin/"
    - "/wp-includes/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
