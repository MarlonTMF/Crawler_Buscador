# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: SICSANTACRUZ (SIC Santa Cruz / Instituto Cruceño de Estadística ICE)
# Onboarding declarativo vía API Strapi v4 (B-33a / D-12)
# ==============================================================================

source:
  id: sicsantacruz
  name: "Sistema de Información y Comunicación Agropecuario Departamental (SIC Santa Cruz / ICE)"
  base_url: https://ice.santacruz.gob.bo
  allowed_domains:
    - ice.santacruz.gob.bo
    - www.ice.santacruz.gob.bo
    - santacruz.gob.bo

crawl:
  seeds:
    - https://ice.santacruz.gob.bo/repositorio
  api_endpoints:
    - url: "https://ice.santacruz.gob.bo/api/estudios?populate=*"
      pagination: strapi_v4
      max_pages: 10
  max_depth: 1
  max_pages: 50
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "uploads"
    - "estudios"
    - "boletin"
    - "precios"
  dataset_rules:
    - id: monitoreo_precios_sic
      name: Monitoreo de Precios Agropecuarios SIC
      url_patterns:
        - "precio"
        - "mercado"
        - "agropecuario"
        - "produccion"
        - "canasta"
    - id: boletines_estadisticos_ice
      name: Boletines y Estudios Estadísticos Departamentales
      url_patterns:
        - "boletin"
        - "estudio"
        - "estadistica"
        - "censo"
        - "poblacion"
        - "salud"
        - "cancer"
    - id: repositorio_institucional_ice
      name: Repositorio General de Estudios
      url_patterns:
        - "/uploads/"
        - "ice"
  excluded_path_keywords:
    - "/login"
    - "/admin"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
