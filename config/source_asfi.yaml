# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: ASFI (Autoridad de Supervisión del Sistema Financiero)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: asfi
  name: "Autoridad de Supervisión del Sistema Financiero"
  base_url: https://www.asfi.gob.bo
  allowed_domains:
    - www.asfi.gob.bo
    - asfi.gob.bo

crawl:
  seeds:
    - https://www.asfi.gob.bo
    - https://www.asfi.gob.bo/pagina-memoria-institucional
    - https://www.asfi.gob.bo/la/balance-general
    - https://www.asfi.gob.bo/la/seguimiento-y-evaluacion-al-poa
  max_depth: 0
  max_pages: 5
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/sites/default/files/"
    - "MEMORIA"
    - "Balance"
    - "POA"
  dataset_rules:
    - id: memoria_institucional
      name: "Memorias Institucionales Anuales"
      url_patterns:
        - "MEMORIA"
        - "memoria"
      title_keywords:
        - "memoria"
        - "anual"
        - "institucional"
    - id: balance_general
      name: "Balances Generales y Estados Financieros"
      url_patterns:
        - "Balance"
        - "balance"
      title_keywords:
        - "balance"
        - "general"
        - "financiero"
    - id: poa_seguimiento
      name: "Programación Operativa Anual (POA) y Evaluaciones"
      url_patterns:
        - "POA"
        - "poa"
      title_keywords:
        - "poa"
        - "operativa"
        - "seguimiento"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
