# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: IBCE - CAO (Instituto Boliviano de Comercio Exterior / Cámara Agropecuaria del Oriente)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: ibce_cao
  name: "Instituto Boliviano de Comercio Exterior / Cámara Agropecuaria del Oriente"
  base_url: https://www.ibce.org.bo
  allowed_domains:
    - www.ibce.org.bo
    - ibce.org.bo

crawl:
  seeds:
    - https://www.ibce.org.bo
    - https://www.ibce.org.bo/publicaciones-ibce.php?publicacion=comercioexterior&opcion=1
  max_depth: 2
  max_pages: 80
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "images/publicaciones/"
    - "CE_"
    - "CE-"
    - "publicaciones-descarga"
  dataset_rules:
    - id: comercio_exterior
      name: "Revista Comercio Exterior y Estadísticas IBCE"
      url_patterns:
        - "images/publicaciones"
        - "CE_"
        - "CE-"
        - "comercioexterior"
      title_keywords:
        - "comercio"
        - "exterior"
        - "cifras"
        - "exportacion"
        - "importacion"
        - "bolivia"
  excluded_path_keywords:
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
