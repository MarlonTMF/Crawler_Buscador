# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: Statistics Denmark (Danmarks Statistik)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: statistics_denmark
  name: "Danmarks Statistik"
  base_url: https://www.dst.dk
  allowed_domains:
    - www.dst.dk
    - dst.dk

crawl:
  seeds:
    - https://www.dst.dk/da/
    - https://www.dst.dk/en/Statistik/nyheder-analyser-publ/Publikationer
    - https://www.dst.dk/en/Statistik/emner
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "Publikationer"
    - "publikationer"
    - "Site"
    - "download"
    - "pdf"
  dataset_rules:
    - id: publikationer
      name: Danmarks Statistik Publikationer
      url_patterns:
        - "publikation"
        - "nyheder-analyser-publ"
    - id: statistik_emner
      name: Emner Statistik
      url_patterns:
        - "emner"
        - "Statistik"
  excluded_path_keywords:
    - "/OmDS/job/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
