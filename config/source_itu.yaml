# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: ITU (International Telecommunication Union)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: itu
  name: "International Telecommunication Union"
  base_url: https://www.itu.int
  allowed_domains:
    - www.itu.int
    - itu.int

crawl:
  seeds:
    - https://www.itu.int
    - https://www.itu.int/en/ITU-D/Statistics/
    - https://www.itu.int/itu-d/reports/statistics/
    - https://www.itu.int/en/publications/
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip, doc, docx]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: true

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "dms_pub"
    - "Documents"
    - "reports"
    - "statistics"
    - "publications"
    - "facts-figures"
  dataset_rules:
    - id: itu_statistics
      name: Estadísticas y Datos TIC
      url_patterns:
        - "/Statistics"
        - "/statistics"
        - "facts-figures"
    - id: itu_reports
      name: Informes y Publicaciones
      url_patterns:
        - "/reports"
        - "/publications"
        - "dms_pub"
  excluded_path_keywords:
    - "/careers/"
    - "/contact/"
    - "/media-centre/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
