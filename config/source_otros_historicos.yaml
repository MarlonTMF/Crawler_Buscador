# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: OTROS HISTORICOS (Doing Business (Banco Mundial))
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: otros_historicos
  name: "Doing Business (Banco Mundial)"
  base_url: https://www.doingbusiness.org
  allowed_domains:
    - www.doingbusiness.org
    - doingbusiness.org
    - www.worldbank.org
    - worldbank.org
    - thedocs.worldbank.org

crawl:
  seeds:
    - https://www.doingbusiness.org
    - https://www.doingbusiness.org/en/businessready/data
    - https://www.doingbusiness.org/en/reports/global-reports/doing-business-2020
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip, doc, docx]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: true

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "b-ready"
    - "documents"
    - "excel"
    - "doing-business"
    - "download"
    - "original"
  dataset_rules:
    - id: doing_business_reports
      name: Informes Doing Business / B-READY
      url_patterns:
        - "doing-business"
        - "B-Ready"
        - "B-READY"
        - "report"
    - id: doing_business_data
      name: Datos y Archivos de Reproducibilidad
      url_patterns:
        - "excel"
        - "data"
        - ".zip"
        - ".xlsx"
  excluded_path_keywords:
    - "/careers/"
    - "/contact/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
