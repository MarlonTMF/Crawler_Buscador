# Example configuration for FINRURAL with opt-in discovery and async fetcher enabled
source:
  id: finrural
  name: FINRURAL
  base_url: https://www.finrural.org.bo
  allowed_domains:
    - www.finrural.org.bo
    - finrural.org.bo

crawl:
  seeds:
    - https://www.finrural.org.bo/reporte-financiero-mensual-instituciones-financieras-de-desarrollo/
    - https://www.finrural.org.bo/archivo-historico/
  max_depth: 3
  max_pages: 500
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true                   # query Wayback CDX for historical URLs
  use_subdomain_enumeration: true    # query crt.sh for certificate-based subdomains
  use_search_dorking: false          # requires search_dorking.provider + API key
  use_async_fetcher: true            # use httpx.AsyncClient via AsyncFetcher
  use_playwright_ocr: false          # opt-in: render pages with Playwright and run OCR (Tesseract)

audit:
  enabled: true

content_hashing:
  enabled: true

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none                     # bing | google | none
  max_results: 50

classification:
  dataset_rules:
    - id: reporte_financiero_mensual
      name: Reporte Financiero Mensual
      url_patterns:
        - "/reporte-financiero-mensual"
        - "/archivos/info_financiera/"
      title_keywords:
        - "reporte financiero mensual"
        - "información financiera"
        - "boletín financiero ifd"
    - id: archivo_historico
      name: Archivo Histórico
      url_patterns:
        - "/archivo-historico"
      title_keywords:
        - "archivo histórico"
        - "historico"
  excluded_path_keywords:
    - "/historia/"
    - "/mision-y-vision/"
    - "/estructura-organizacional/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "financiera_(?P<month>0[1-9]|1[0-2])_(?P<year>20\\d{2})\\.pdf"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
    - x16877
  preserve_query_parameters: []

# Advanced options (optional)
advanced:
  wayback_limit: 500
  subdomain_limit: 200
