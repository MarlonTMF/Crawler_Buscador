# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: BM (Banco Mundial)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: bm
  name: "Banco Mundial"
  base_url: https://www.worldbank.org
  allowed_domains:
    - www.worldbank.org
    - worldbank.org
    - openknowledge.worldbank.org
    - documents.worldbank.org
    - data.worldbank.org
    - thedocs.worldbank.org

crawl:
  seeds:
    - https://www.worldbank.org
    - https://openknowledge.worldbank.org
    - https://data.worldbank.org
    - https://www.worldbank.org/en/research
  max_depth: 2
  max_pages: 120
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip, doc, docx]
  use_sitemaps: true
  use_wayback: true
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "bitstreams"
    - "documents"
    - "reports"
    - "publication"
    - "download"
    - "data"
  dataset_rules:
    - id: openknowledge
      name: Open Knowledge Repository
      url_patterns:
        - "/bitstreams"
        - "/handle"
        - "openknowledge.worldbank.org"
    - id: research_publications
      name: Informes y Publicaciones
      url_patterns:
        - "/publication"
        - "/research"
        - "/documents-reports"
    - id: datasets
      name: Datos y Series
      url_patterns:
        - "/data"
        - "/indicator"
  excluded_path_keywords:
    - "/careers/"
    - "/news/"
    - "/events/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
