# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: SNIS (Sistema Nacional de Información en Salud)
# Calibrado para B-19 (Etapa C)
# ==============================================================================

source:
  id: snis
  name: "Sistema Nacional de Información en Salud"
  base_url: https://snis.minsalud.gob.bo
  allowed_domains:
    - www.snis.minsalud.gob.bo
    - snis.minsalud.gob.bo

crawl:
  seeds:
    - https://snis.minsalud.gob.bo/publicaciones
    - https://snis.minsalud.gob.bo/51-boletin-produccion-de-servicios
    - https://snis.minsalud.gob.bo/52-boletin-carpeta-familiar
    - https://snis.minsalud.gob.bo/54-boletin-hechos-vitales
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: false
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - images
    - CarpetaFamiliar
    - boletin
    - pdf
  dataset_rules:
    - id: carpeta_familiar
      name: "Carpeta Familiar y Manuales"
      url_patterns:
        - "CarpetaFamiliar"
        - "carpeta"
    - id: boletines_epidemiologicos
      name: "Boletines Epidemiológicos y Estadísticos"
      url_patterns:
        - "boletin"
        - "Boletin"
    - id: publicaciones_salud
      name: "Publicaciones e Información en Salud"
      url_patterns:
        - "images"
        - "snis.minsalud.gob.bo"
  excluded_path_keywords:
    - "/page/"
    - "/contacto"
    - "/login"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "(?P<year>20\\d{2})"

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
