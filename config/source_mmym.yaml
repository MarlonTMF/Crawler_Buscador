# ==============================================================================
# Configuración del Prospector Externo — DataX Web Prospector
# Fuente: MMYM (Ministerio de Minería y Metalurgia)
# Esqueleto autogenerado por scripts/generar_yaml_fuente.py (Etapa C / B-12)
# ==============================================================================

source:
  id: mmym
  name: "Ministerio de Minería y Metalurgia"
  base_url: https://www.mineria.gob.bo
  allowed_domains:
    - www.mineria.gob.bo
    - mineria.gob.bo

crawl:
  seeds:
    - https://www.mineria.gob.bo
    - https://www.mineria.gob.bo/index.php/boletines/
    - https://www.mineria.gob.bo/index.php/memoria-intitucional/
  max_depth: 1
  max_pages: 35
  strategy: bfs
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: false
  use_search_dorking: false
  use_subdomain_enumeration: false
  use_async_fetcher: false
  use_playwright: false
  use_playwright_ocr: false
  headless: false

audit:
  enabled: true

content_hashing:
  enabled: false

monitoring:
  drift_threshold: 0.30
  historical_resource_counts: []

search_dorking:
  provider: none
  max_results: 50

classification:
  document_path_tokens:
    - "/wp-content/uploads/"
    - "Boletin"
    - "MI-"
  dataset_rules:
    - id: memorias_institucionales
      name: "Memorias Institucionales de Entidades Mineras"
      url_patterns:
        - "MI-"
        - "memoria"
        - "Memoria"
      title_keywords:
        - "memoria"
        - "senarecom"
        - "sergeomin"
        - "ajam"
        - "institucional"
    - id: boletines_estadisticos_mineria
      name: "Boletines Estadísticos Trimestrales y Semestrales de Minería"
      url_patterns:
        - "Boletin"
        - "boletin"
        - "Bol_"
      title_keywords:
        - "boletin"
        - "mineria"
        - "estadistica"
        - "trimestre"
        - "semestre"
    - id: gestion_institucional_minera
      name: "Informes de Gestión, Ejecución Presupuestaria y Normativa Minera"
      url_patterns:
        - "Reporte"
        - "Informe"
        - "PEI"
        - "Ley"
        - "Decreto"
        - "wp-content/uploads"
      title_keywords:
        - "informe"
        - "ejecucion"
        - "presupuesto"
        - "normativa"
  excluded_path_keywords:
    - "/contacto"
    - "/login"
    - "/page/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
  filename_pattern: "" # TODO: definir regex con (?P<year>...) segun nomenclatura de archivos de la fuente

canonicalization:
  drop_query_parameters:
    - utm_source
    - utm_medium
    - utm_campaign
    - fbclid
  preserve_query_parameters: []
