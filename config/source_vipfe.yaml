source:
  id: vipfe
  name: Viceministerio de Inversión Pública y Financiamiento Externo (VIPFE)
  base_url: https://www.planificacion.gob.bo
  allowed_domains:
    - planificacion.gob.bo
    - www.planificacion.gob.bo
    - vipfe.gob.bo
    - www.vipfe.gob.bo

crawl:
  seeds:
    - https://www.planificacion.gob.bo/vipfe
    - https://www.planificacion.gob.bo/
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true
  use_playwright: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "vipfe"
    - "inversion"
    - "financiamiento"
    - "uploads"
    - "documentos"
  dataset_rules:
    - id: inversion_publica_vipfe
      name: Documentos e Informes de Inversión Pública VIPFE
      url_patterns:
        - "inversion"
        - "vipfe"
        - "financiamiento"
    - id: repositorio_general_vipfe
      name: Repositorio General VIPFE/Planificación
      url_patterns:
        - "/uploads/"
        - "/documentos/"
  excluded_path_keywords:
    - "/assets/"
    - "/wp-admin/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
