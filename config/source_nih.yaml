source:
  id: nih
  name: National Institute on Drug Abuse (NIH / NIDA)
  base_url: https://nida.nih.gov
  allowed_domains:
    - nida.nih.gov
    - www.nih.gov

crawl:
  seeds:
    - https://nida.nih.gov/
    - https://nida.nih.gov/research-topics/trends-statistics
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "publications"
    - "research"
    - "statistics"
    - "reports"
    - "pdf"
  dataset_rules:
    - id: reportes_estadisticas_nih
      name: Reportes y Estadísticas NIH/NIDA
      url_patterns:
        - "trends"
        - "statistics"
        - "report"
    - id: publicaciones_cientificas_nih
      name: Publicaciones Científicas y Guías NIH/NIDA
      url_patterns:
        - "publication"
        - "guide"
        - "research"
    - id: repositorio_general_nih
      name: Repositorio General NIH/NIDA
      url_patterns:
        - "/sites/default/files/"
        - "/files/"
        - "/download/"
  excluded_path_keywords:
    - "/user/"
    - "/admin/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
