source:
  id: sispam
  name: Sistema de Seguimiento de Producción y Precios (SISPAM / OAP)
  base_url: https://oap.produccion.gob.bo
  allowed_domains:
    - oap.produccion.gob.bo
    - produccion.gob.bo

crawl:
  seeds:
    - https://oap.produccion.gob.bo/
    - https://oap.produccion.gob.bo/institucional/
  max_depth: 2
  max_pages: 50
  rate_limit_per_second: 1.0
  allowed_extensions: [pdf, xlsx, xls, csv, zip]
  use_sitemaps: true
  use_wayback: true

audit:
  enabled: true

content_hashing:
  enabled: true

classification:
  document_path_tokens:
    - "wp-content"
    - "uploads"
    - "boletin"
    - "precios"
    - "produccion"
  dataset_rules:
    - id: boletines_precios_sispam
      name: Boletines de Precios y Mercados SISPAM/OAP
      url_patterns:
        - "boletin"
        - "precio"
        - "diario"
        - "semanal"
    - id: informes_produccion_sispam
      name: Informes y Estadísticas de Producción SISPAM/OAP
      url_patterns:
        - "produccion"
        - "informe"
        - "estadistica"
        - "abastecimiento"
    - id: repositorio_general_sispam
      name: Repositorio General SISPAM/OAP
      url_patterns:
        - "/uploads/"
        - "/wp-content/"
  excluded_path_keywords:
    - "/wp-admin/"
    - "/wp-includes/"

period_extraction:
  months_es:
    enero: 1
    febrero: 2
    marzo: 3
    abril: 4
    mayo: 5
    junio: 6
    julio: 7
    agosto: 8
    septiembre: 9
    octubre: 10
    noviembre: 11
    diciembre: 12
