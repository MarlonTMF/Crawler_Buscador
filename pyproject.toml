[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler_finrural"
version = "1.0.0"
description = "Prospector Externo y Crawler de Fuentes Financieras (FINRURAL) — Equipo 1 DataX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18.0",
    "httpx>=0.24.0",
    # Optional runtime for headless rendering and OCR (opt-in)
    "playwright>=1.40.0 ; extra == 'playwright'",
    "pillow>=9.0.0 ; extra == 'ocr'",
    "pytesseract>=0.3.10 ; extra == 'ocr'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
crawler-finrural = "crawler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: toca red real o navegador real y puede tardar minutos (2026-09-17: 2 casos confirmados colgando >60s pese a mockear session.head/get, porque el fallback interno de HttpFetcher escapa el mock). Excluir con -m 'not live' para verificación rápida; correr sin filtro antes de un release.",
]
